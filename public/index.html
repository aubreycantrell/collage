<!doctype html>
<html lang="en" data-theme="ocean">
<head>
  <meta charset="utf-8" />
  <title>Maquette</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#DAD3C5; --fg:#2A2A28; --muted:#8B8579; --card:#F0ECE3;
      --accent:#2B4C7E; --accent2:#B5482F; --border:#A99F8E; --ok:#4C6B3C; --warn:#B5482F;
    }
    :root[data-theme="ocean"]  { --bg:#CBD6D6; --fg:#1E2E2E; --muted:#748585; --card:#EDF2F2; --accent:#245C6E; --accent2:#B5482F; --border:#9FB4B4; --ok:#4C6B3C; --warn:#B5482F; }
    :root[data-theme="sunset"] { --bg:#DECFC0; --fg:#332419; --muted:#8C7867; --card:#F5ECE1; --accent:#2B4C7E; --accent2:#B5482F; --border:#C7B29D; --ok:#4C6B3C; --warn:#B5482F; }
    :root[data-theme="forest"] { --bg:#D2D8C7; --fg:#242D1D; --muted:#79806A; --card:#EEF1E7; --accent:#2B4C7E; --accent2:#8A5A2B; --border:#B7BFA7; --ok:#4C6B3C; --warn:#B5482F; }
    :root[data-theme="floral"] { --bg:#DDD0D8; --fg:#2E2130; --muted:#8A7787; --card:#F3ECF1; --accent:#5C4A7E; --accent2:#B5482F; --border:#C4B0C0; --ok:#4C6B3C; --warn:#B5482F; }
    :root[data-theme="desert"] { --bg:#DFD1B7; --fg:#332A19; --muted:#8F7E5F; --card:#F4ECDB; --accent:#2B4C7E; --accent2:#B5482F; --border:#C9B78E; --ok:#4C6B3C; --warn:#B5482F; }
    :root[data-theme="aurora"] { --bg:#CBD6D3; --fg:#1D2C29; --muted:#728480; --card:#ECF2F0; --accent:#22617C; --accent2:#B5482F; --border:#9FB4AF; --ok:#4C6B3C; --warn:#B5482F; }
    :root[data-theme="noir"]   { --bg:#D6D3CD; --fg:#232220; --muted:#807A70; --card:#F0EEE8; --accent:#3A3A38; --accent2:#B5482F; --border:#B7B2A6; --ok:#4C6B3C; --warn:#B5482F; }
    :root[data-theme="mono"]   { --bg:#D3D1DA; --fg:#25232E; --muted:#7C7A87; --card:#EEEDF2; --accent:#3E3F7E; --accent2:#B5482F; --border:#B3B1C0; --ok:#4C6B3C; --warn:#B5482F; }

    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font-family:"Space Grotesk", system-ui, -apple-system, sans-serif;
      background-image: linear-gradient(rgba(43,76,126,.05) 1px, transparent 1px),
                         linear-gradient(90deg, rgba(43,76,126,.05) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .wrap { min-height:100dvh; display:grid; place-items:center; padding:24px; }
    .card {
      width:100%; max-width:560px; text-align:center;
      background:var(--card); border:1.5px solid var(--border); border-radius:3px;
      padding:36px 32px; box-shadow: 3px 3px 0 rgba(42,42,40,.08);
    }
    h1 { margin:0 0 6px; font-family:"Caveat", cursive; font-weight:600; font-size:38px; color:var(--fg); }
    h2 { margin:0 0 14px; font-family:"Caveat", cursive; font-weight:500; font-size:26px; color:var(--fg); opacity:.9; }
    p { margin:0 0 20px; color:var(--muted); font-size:14px; }

    label { font-size:12px; color:var(--muted); }
    .field {
      background:var(--bg); border:1px solid var(--border); border-radius:2px;
      padding:10px 12px; display:flex; gap:8px; align-items:center;
    }
    input[type="text"]{
      flex:1; border:0; outline:none; background:transparent; color:var(--fg);
      font-size:16px; font-family:"Space Grotesk", sans-serif;
    }

    .btn {
      display:inline-flex; align-items:center; gap:8px;
      border-radius:3px; border:1.5px solid var(--fg);
      background:var(--card); color:var(--fg); padding:10px 16px;
      font-weight:600; font-family:"Space Grotesk", sans-serif;
      cursor:pointer; transition: background .15s, color .15s;
    }
    .btn:hover:not([disabled]) { background:var(--fg); color:var(--card); }
    .btn.ghost { background:transparent; }
    .btn[disabled]{ opacity:.5; cursor:not-allowed; }
    .btn.primary { background:var(--accent); color:var(--card); border-color:var(--accent); }
    .btn.primary:hover:not([disabled]) { background:var(--fg); border-color:var(--fg); }

    .footer { display:flex; gap:10px; justify-content:center; margin-top:24px; }

    .step { display:none; }
    .step.active { display:block; }

    .swatches { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px; }
    .swatch {
      border:1.5px solid var(--border); border-radius:2px; overflow:hidden;
      cursor:pointer; background:var(--bg); transition: border-color .15s;
    }
    .swatch .bars { display:grid; grid-template-columns:repeat(5,1fr); height:36px; }
    .swatch span { display:block; height:100%; }
    .swatch label {
      display:block; text-align:center; padding:6px;
      color:var(--muted); font-size:11px; text-transform:capitalize;
      font-family:"Space Grotesk", sans-serif; cursor:pointer;
    }
    .swatch.active { border-color:var(--accent); box-shadow: 2px 2px 0 rgba(43,76,126,.15); }

    .hint { margin-top:8px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- STEP 1: Welcome -->
    <div id="step-welcome" class="step active card">
      <h1>Welcome to Maquette</h1>
      <h2>Let's set up your studio</h2>
      <p>We'll start with a username and a color palette — let's make this space yours.</p>
      <div class="footer">
        <button id="toTheme" class="btn primary" aria-label="Continue">Continue</button>
      </div>
    </div>

    <!-- STEP 2: Pick Theme -->
    <div id="step-theme" class="step card">
      <h1>Pick your palette</h1>
      <p>Choose the vibe for your studio.</p>
      <div class="swatches" id="swatches"></div>
      <div class="footer">
        <button id="backToWelcome" class="btn ghost" aria-label="Back">Back</button>
        <button id="toUsername" class="btn primary" aria-label="Continue">Continue</button>
      </div>
    </div>

    <!-- STEP 3: Username -->
    <div id="step-username" class="step card">
      <h1>Create your username</h1>
      <div class="field">
        <input id="username" type="text" placeholder="Your creative handle" />
        <button id="randBtn" class="btn ghost" type="button">Randomize</button>
      </div>
      <div class="hint">Tip: click Randomize until you like it.</div>
      <div class="footer">
        <button id="backToTheme" class="btn ghost" aria-label="Back">Back</button>
        <button id="startBtn" class="btn primary" aria-label="Continue">Start</button>
      </div>
    </div>
  </main>

  <script>
    // ---------- Step control ----------
    const steps = {
      welcome: document.getElementById('step-welcome'),
      theme: document.getElementById('step-theme'),
      usernameStep: document.getElementById('step-username'),
    };
    function show(id){
      Object.values(steps).forEach(el => el.classList.remove('active'));
      id.classList.add('active');
    }

    // ---------- Random username ----------
    const adjectives = [
      "chromatic","luminous","textured","kinetic","ethereal","avant-garde",
      "verdant","sinuous","prismatic","minimal","baroque","pastel",
      "monochrome","surreal","vivid","oblique","nocturne","gilded",
      "rustic","nebulous"
    ];

    const nouns = [
      "heron","lynx","kestrel","otter","moth","fox","sparrow","orca","puma","ibex",
      "cobra","cormorant","gecko","jackal","manatee","tamarin","wren","viper","lark","cuttlefish"
    ];

    const rand = arr => arr[Math.floor(Math.random()*arr.length)];
    const makeName = () => `${rand(adjectives)}_${rand(nouns)}_${Math.floor(100+Math.random()*900)}`;

    // ---------- Theme swatches ----------
    const THEMES = {
      ocean:  ["#CBD6D6","#EDF2F2","#245C6E","#B5482F","#1E2E2E"],
      sunset: ["#DECFC0","#F5ECE1","#2B4C7E","#B5482F","#332419"],
      forest: ["#D2D8C7","#EEF1E7","#2B4C7E","#8A5A2B","#242D1D"],
      floral: ["#DDD0D8","#F3ECF1","#5C4A7E","#B5482F","#2E2130"],
      desert: ["#DFD1B7","#F4ECDB","#2B4C7E","#B5482F","#332A19"],
      aurora: ["#CBD6D3","#ECF2F0","#22617C","#B5482F","#1D2C29"],
      noir:   ["#D6D3CD","#F0EEE8","#3A3A38","#B5482F","#232220"],
      mono:   ["#D3D1DA","#EEEDF2","#3E3F7E","#B5482F","#25232E"]
    };

    const swatches = document.getElementById('swatches');

    function renderSwatches(active="ocean"){
      swatches.innerHTML = "";
      Object.entries(THEMES).forEach(([key, colors]) => {
        const div = document.createElement('div');
        div.className = 'swatch' + (key===active ? ' active' : '');
        div.dataset.theme = key;
        div.innerHTML = `
          <div class="bars">
            <span style="background:${colors[0]}"></span>
            <span style="background:${colors[1]}"></span>
            <span style="background:${colors[2]}"></span>
            <span style="background:${colors[3]}"></span>
            <span style="background:${colors[4]}"></span>
          </div>
          <label>${key}</label>
        `;
        div.addEventListener('click', () => {
          document.documentElement.setAttribute('data-theme', key);
          [...swatches.children].forEach(el => el.classList.toggle('active', el===div));
          localStorage.setItem('theme', key);
        });
        swatches.appendChild(div);
      });
    }

    // ---------- Elements ----------
    const username   = document.getElementById('username');
    const randBtn    = document.getElementById('randBtn');
    const startBtn   = document.getElementById('startBtn');

    const toTheme      = document.getElementById('toTheme');
    const backToWelcome= document.getElementById('backToWelcome');
    const toUsername    = document.getElementById('toUsername');
    const backToTheme  = document.getElementById('backToTheme');

    // ---------- Enable save when username present ----------
    function maybeEnableStart(){ startBtn.disabled = !username.value.trim(); }

    // ---------- Prefill ----------
    const savedTheme = localStorage.getItem('theme') || 'ocean';
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    renderSwatches(savedTheme);

    const savedName = localStorage.getItem('userName');
    username.value = savedName || makeName();
    maybeEnableStart();

    // ---------- Events ----------
    toTheme.addEventListener('click', () => show(steps.theme));
    backToWelcome.addEventListener('click', () => show(steps.welcome));
    toUsername.addEventListener('click', () => show(steps.usernameStep));
    backToTheme.addEventListener('click', () => show(steps.theme));

    randBtn.addEventListener('click', () => { username.value = makeName(); maybeEnableStart(); });
    username.addEventListener('input', maybeEnableStart);

    startBtn.addEventListener('click', () => {
      const name  = username.value.trim() || makeName();
      const theme = document.documentElement.getAttribute('data-theme') || 'ocean';
      localStorage.setItem('userName', name);
      localStorage.setItem('theme', theme);
      window.location.href = 'create.html';
    });
  </script>
</body>
</html>
